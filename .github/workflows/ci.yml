name: CI

# Quality gates on every PR and every push to main: type-check, lint, format,
# tests. Before this, those gates ran only inside update-feed.yml, i.e. after
# a merge, so a broken merge first surfaced as a failed feed publish.
#
# Not a required status check: update-feed.yml pushes feed commits straight to
# main, and branch protection that requires checks would reject those pushes.
# Watch it with `gh pr checks <n> --watch` before merging. release.yml starts
# when this workflow's push run on main passes (it matches the name "CI": keep
# it), so keep paths-ignore limited to feed output.

on:
  pull_request:
  push:
    branches: [main]
    # Feed-only commits from update-feed.yml change nothing these gates check.
    paths-ignore:
      - 'docs/**'
      - 'output/**'

permissions:
  contents: read

# PRs: one group per branch, superseded runs cancelled. Pushes to main: one
# group per commit, so no run is ever cancelled or dropped from the queue
# (GitHub keeps only one pending run per group); release.yml follows it.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Run tests
        run: npm test
