name: Site Drift

# Early warning for Church website changes that would break the scraper.
# Re-scrapes the newest complete saved conference straight from the live site
# (cache off) and compares it with the committed JSON in output/. Fewer
# sessions or talks, lost audio or duration, or a changed audio URL pattern
# fails the run; speaker-photo changes are warnings only. Spec: gc_podcast-c8i.
#
# Deliberately a separate workflow that only reads: a fault in this file or
# script can never stop update-feed.yml from publishing.
#
# Permissions: contents:read to check out the code and saved data;
# issues:write to open a `site-drift` issue (or comment on the open one) when
# the check fails, and to close it once a run passes.

on:
  schedule:
    # Monthly on the 25th, so drift is found 1-2 weeks before the
    # April/October conference weekend.
    - cron: '30 12 25 * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-drift
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check for site drift
        # pipefail: without it the step would take tee's exit code and never fail.
        run: |
          set -o pipefail
          npx tsx src/check-drift.ts --lang all | tee site-drift.txt

      - name: Alert on site drift
        if: failure()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const report = fs.existsSync('site-drift.txt') ? fs.readFileSync('site-drift.txt', 'utf8') : '(no report)';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            // Joined lines, not a multi-line template literal: a line at
            // column 0 would end the YAML `script: |` block.
            const body = [
              `Site drift check failed ([run ${context.runNumber}](${runUrl})).`,
              '',
              'A fresh scrape of a saved conference no longer matches the committed copy.',
              'The Church site may have changed; fix the scraper before the next conference.',
              '',
              '```',
              report.trim(),
              '```'
            ].join('\n');
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'site-drift',
              state: 'open',
              per_page: 1
            });
            if (open.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: open[0].number,
                body
              });
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Site drift: live scrape of a saved conference lost talks, audio or sessions',
              body,
              labels: ['site-drift', 'automated']
            });

      - name: Close resolved site-drift issue
        # A passing run is the verification: close the open issue with proof.
        if: success()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const report = fs.existsSync('site-drift.txt') ? fs.readFileSync('site-drift.txt', 'utf8') : '(no report)';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'site-drift',
              state: 'open'
            });
            for (const issue of open) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: [`Resolved: [run ${context.runNumber}](${runUrl}) passed the drift check.`, '', '```', report.trim(), '```'].join('\n')
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
                state_reason: 'completed'
              });
            }
