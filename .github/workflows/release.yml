name: Release

# Every version bump on main becomes a GitHub release, but only from a commit
# whose CI passed (gc_podcast-e88). Runs when a CI push run on main finishes:
# if it passed and the commit's package.json version has no release yet, it
# creates one at that commit. Red CI never releases (the CI run itself shows
# red); re-running CI to green releases with no further action.
#
# Relies on ci.yml running on every push to main that touches package.json
# (its paths-ignore covers only feed output). workflow_run always uses this
# file from the default branch.
#
# Permissions: contents:write to create the tag and release.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

# One group per commit: a shared group keeps only one pending run, so a quick
# second bump could silently drop the first version's release.
concurrency:
  group: release-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  release:
    if: github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout the CI-tested commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Create release for a new version
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "$VERSION already released; nothing to do."
            exit 0
          fi
          gh release create "$VERSION" --target "$SHA" --title "$VERSION" --generate-notes
